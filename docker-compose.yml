services:
  postgres:
    image: postgres:16-alpine
    container_name: svoikrug_db
    environment:
      POSTGRES_USER: svoikrug
      POSTGRES_PASSWORD: svoikrug_secret
      POSTGRES_DB: svoikrug_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: svoikrug_cache
    ports:
      - "6379:6379"

volumes:
  pgdata:
