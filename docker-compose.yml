services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: svoikrug_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: svoikrug
      POSTGRES_PASSWORD: svoikrug_secret
      POSTGRES_DB: svoikrug_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - svoikrug_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svoikrug -d svoikrug_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend: Fastify + Prisma ───────────────────────────
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: svoikrug_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://svoikrug:svoikrug_secret@db:5432/svoikrug_dev?schema=public
      PORT: 4000
      JWT_SECRET: svoikrug_dev_secret_change_me_in_prod
    volumes:
      - ./api:/app:cached
      - /app/node_modules
    ports:
      - "4000:4000"
    networks:
      - svoikrug_net
    command: npm run dev

  # ── Frontend: Next.js 14 ────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: svoikrug_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    volumes:
      - ./web:/app:cached
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - svoikrug_net
    command: npm run dev

networks:
  svoikrug_net:
    driver: bridge

volumes:
  postgres_data: